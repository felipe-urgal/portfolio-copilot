name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto format
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    outputs:
      changed: ${{ steps.formatting.outputs.changed }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Format
        run: >-
          npx --yes prettier@3.9.6 --write
          "apps/**/*.{ts,tsx,css,json}"
          "packages/**/*.{ts,json}"
          "*.{json,yaml,yml,mjs}"
          ".github/**/*.yml"

      - name: Commit formatting when needed
        id: formatting
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: autoformat"
          git push origin "HEAD:$HEAD_REF"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run CI on formatted head
        if: steps.formatting.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --ref "$HEAD_REF"

  quality:
    name: Quality gate
    needs: format
    if: >-
      always() &&
      (github.event_name != 'pull_request' || needs.format.outputs.changed != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CHECK_DATABASE_URL: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio_copilot_test

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U portfolio -d portfolio_copilot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local Docker Compose
        run: docker compose config --quiet

      - name: Production check
        run: pnpm prod:check

      - name: Verify root .env.local database fallback
        run: |
          trap 'rm -f .env.local' EXIT
          printf 'DATABASE_URL="%s"\n' "$CHECK_DATABASE_URL" > .env.local
          DATABASE_URL= pnpm db:migrate
