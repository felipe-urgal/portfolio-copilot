name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio_copilot_test

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U portfolio -d portfolio_copilot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies and refresh workspace lockfile
        run: |
          pnpm install --no-frozen-lockfile
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "portfolio-copilot-ci"
            git config user.email "portfolio-copilot-ci@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update market-data lockfile"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Validate local Docker Compose
        run: docker compose config --quiet

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Verify root .env.local database fallback
        run: |
          trap 'rm -f .env.local' EXIT
          printf 'DATABASE_URL="%s"\n' "$DATABASE_URL" > .env.local
          DATABASE_URL= pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
