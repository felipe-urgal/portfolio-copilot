name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format R3 head
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/app-shell-navigation

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prettier
        run: pnpm exec prettier --write apps/web/src/components/app-shell-navigation.tsx apps/web/src/features/onboarding/financial-onboarding-flow.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet -- apps/web/src/components/app-shell-navigation.tsx apps/web/src/features/onboarding/financial-onboarding-flow.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/app-shell-navigation.tsx apps/web/src/features/onboarding/financial-onboarding-flow.tsx
          git commit -m "style(ui): format R3 shell migration"
          git push origin HEAD:feature/app-shell-navigation
