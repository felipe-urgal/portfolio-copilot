name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose exact Prettier diff
        run: |
          pnpm exec prettier --write \
            apps/web/src/features/portfolio/contribution-cost-form.test.ts \
            apps/web/src/features/portfolio/contribution-cost-form.ts \
            apps/web/src/features/portfolio/contribution-cost-section.tsx
          git diff -- \
            apps/web/src/features/portfolio/contribution-cost-form.test.ts \
            apps/web/src/features/portfolio/contribution-cost-form.ts \
            apps/web/src/features/portfolio/contribution-cost-section.tsx
          git diff --exit-code -- \
            apps/web/src/features/portfolio/contribution-cost-form.test.ts \
            apps/web/src/features/portfolio/contribution-cost-form.ts \
            apps/web/src/features/portfolio/contribution-cost-section.tsx

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
