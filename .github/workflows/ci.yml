name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio_copilot_test

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U portfolio -d portfolio_copilot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/onboarding-redesign
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier and push
        run: |
          pnpm exec prettier --write apps/web/src/features/onboarding/financial-onboarding-flow.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/onboarding/financial-onboarding-flow.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "style: apply canonical onboarding formatting"
            git push origin HEAD:feature/onboarding-redesign
          fi
