name: Prepare persistence branch

on:
  push:
    branches:
      - feature/server-persistence-ownership

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate

      - name: Resolve reviewed dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Generate PostgreSQL migration
        run: pnpm db:generate

      - name: Format changed sources
        run: pnpm format

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml packages/persistence/drizzle packages/persistence apps/web package.json .env.example
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: generate persistence migration and lockfile"
          git push
