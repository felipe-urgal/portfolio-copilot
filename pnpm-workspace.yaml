packages:
  - apps/*
  - packages/*

# pnpm 11 protects the supply chain by delaying packages published in the last 24h.
# Next.js 16.3.3 is an intentionally reviewed security release from 2026-08-25.
# Keep the global protection and exempt only the exact release graph we approved.
minimumReleaseAgeExclude:
  - next@16.3.3
  - eslint-config-next@16.3.3
  - '@next/env@16.3.3'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
minimumReleaseAgeExcludePrune: true

# pnpm 11 fails on any unreviewed dependency build. Allow only packages whose
# lifecycle scripts were explicitly reviewed for this dependency graph.
allowBuilds:
  unrs-resolver@1.12.2: true
