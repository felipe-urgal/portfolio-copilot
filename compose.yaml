services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_copilot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - portfolio_copilot_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio_copilot_postgres:
